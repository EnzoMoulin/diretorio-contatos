<script>
/* Mapa Leaflet (espelho do mapa.js da v2) — initMapa/destacarComarcaMapa/norm. */
(function () {
  "use strict";
  var GEOJSON_URL = "https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-32-mun.json";

  window.norm = window.norm || function (s) {
    return String(s == null ? "" : s).toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  };

  var _mapaOK = false;
  var _map = null;
  var _layer = null;
  var _selecionado = "";

  function corPorDensidade(n) {
    if (!n) return "#e2e8f0";
    if (n <= 3) return "#bfdbfe";
    if (n <= 7) return "#60a5fa";
    return "#1d63b8";
  }

  function estiloComarca(nome, total) {
    var isSel = _selecionado && norm(nome) === norm(_selecionado);
    return {
      fillColor: isSel ? "#00adb5" : (total ? "#93c5fd" : "#f1f5f9"),
      fillOpacity: isSel ? 0.85 : (total ? 0.65 : 0.25),
      color: isSel ? "#0f172a" : (total ? "#2563eb" : "#94a3b8"),
      weight: isSel ? 2.4 : 2,
      opacity: 1
    };
  }

  window.destacarComarcaMapa = function (nome) {
    _selecionado = nome || "";
    if (!_layer) return;
    _layer.eachLayer(function (l) {
      var nm = (l.feature && l.feature.properties && l.feature.properties.name) || "";
      l.setStyle(estiloComarca(nm, l._total || 0));
    });
  };

  window.initMapa = function (mapId, msgId, locs, onSelect) {
    var msg = document.getElementById(msgId);
    if (_mapaOK) return true;
    if (typeof L === "undefined") {
      if (msg) msg.textContent = "Mapa indisponível offline — use os menus do painel.";
      return false;
    }
    _mapaOK = true;
    try {
      _map = L.map(mapId, { zoomControl: true, attributionControl: true, scrollWheelZoom: true, zoomSnap: 0.5 })
        .setView([-19.5, -40.3], 9);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(_map);
      var dens = {};
      (locs || []).forEach(function (l) { dens[norm(l.nome)] = l.total; });
      fetch(GEOJSON_URL).then(function (r) { return r.json(); }).then(function (gj) {
        _layer = L.geoJSON(gj, {
          style: function (f) {
            var nome = String((f.properties && f.properties.name) || "").trim();
            return estiloComarca(nome, dens[norm(nome)] || 0);
          },
          onEachFeature: function (f, l) {
            (function (layer) {
              var nome = String((f.properties && f.properties.name) || "").trim();
              var n = dens[norm(nome)] || 0;
              layer._total = n;
              layer.bindTooltip(
                '<div class="tooltip-premium">' + nome + "<small>" + n + " contato(s)</small></div>",
                { permanent: false, direction: "auto", sticky: true });
              layer.on({
                mouseover: function (e) {
                  if (norm(_selecionado) !== norm(nome)) {
                    e.target.setStyle({ fillColor: "#00adb5", fillOpacity: 0.78, weight: 2.2, color: "#0f172a" });
                    try { e.target.bringToFront(); } catch (x) {}
                  }
                },
                mouseout: function (e) {
                  if (norm(_selecionado) === norm(nome)) {
                    e.target.setStyle({ fillColor: "#00adb5", fillOpacity: 0.85, weight: 2.4, color: "#0f172a" });
                  } else _layer.resetStyle(e.target);
                },
                click: function () { if (onSelect) onSelect(nome); }
              });
            })(l);
          }
        }).addTo(_map);
        _layer.eachLayer(function (l) { if (l._total) { try { l.bringToFront(); } catch (x) {} } });
        enquadrar();
        setTimeout(function () { try { _map.invalidateSize(); enquadrar(); } catch (e) {} }, 220);
        var legenda = L.control({ position: "bottomright" });
        legenda.onAdd = function () {
          var div = L.DomUtil.create("div", "fc-map-legenda");
          div.innerHTML = '<span class="tem-contato">● Comarcas com contatos</span>' +
            '<span class="sem-contato">● Sem contatos cadastrados</span>';
          return div;
        };
        legenda.addTo(_map);
        if (msg) msg.textContent = "";
      }).catch(function () {
        if (msg) msg.textContent = "Mapa indisponível offline — use os menus do painel.";
      });
      return true;
    } catch (e) {
      if (msg) msg.textContent = "Mapa indisponível offline — use os menus do painel.";
      return false;
    }
  };

  function enquadrar() {
    try {
      _map.fitBounds(_layer.getBounds(), { padding: [-14, -14] });
      _map.setZoom(_map.getZoom() + 0.5, { animate: false });
    } catch (e) {}
  }
})();
</script>
