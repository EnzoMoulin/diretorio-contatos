<script>
(function () {
  "use strict";

  var comarcasPainelV6 = [];
  var comarcaSelecionadaPainelV6 = "";
  var carregandoComarcasPainelV6 = false;
  var dashboardCarregandoV6 = false;

  function normalizar(valor) {
    return String(valor == null ? "" : valor)
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-zA-Z0-9]/g, "")
      .toUpperCase();
  }

  function campo(item, nomes) {
    if (!item) return "";
    if (typeof window.campoTelefone === "function") {
      try { return window.campoTelefone(item, nomes); } catch (erro) {}
    }
    var chaves = Object.keys(item);
    for (var i = 0; i < nomes.length; i++) {
      var nome = nomes[i];
      if (Object.prototype.hasOwnProperty.call(item, nome)) return item[nome];
      var alvo = normalizar(nome);
      var chave = chaves.find(function (c) { return normalizar(c) === alvo; });
      if (chave !== undefined) return item[chave];
    }
    return "";
  }

  function tipoContato(tipo) {
    var chave = normalizar(tipo);
    if (chave === "TELEFONE" || chave === "CELULAR") return "Telefone";
    if (chave === "RAMAL") return "Ramal";
    if (chave === "WHATSAPP") return "WhatsApp";
    if (chave === "EMAIL") return "E-mail";
    return "";
  }

  function atualizarTexto(id, valor) {
    var el = document.getElementById(id);
    if (el) el.textContent = String(valor == null ? 0 : valor);
  }

  function instalarAjustesVisuaisGlobais() {
    if (document.getElementById("demo-v6-ajustes-visuais")) return;
    var style = document.createElement("style");
    style.id = "demo-v6-ajustes-visuais";
    style.textContent =
      "#btn-status-acesso.btn-sair{min-width:112px;padding-left:18px!important;padding-right:18px!important;}" +
      ".fc-comarca-select{margin:8px 0 12px;}";
    document.head.appendChild(style);
  }

  function removerBotoesImpressaoDashboardLegados() {
    var botaoTopbar = document.getElementById("btn-imprimir-dashboard");
    if (botaoTopbar) botaoTopbar.remove();

    var botaoCompatibilidade = document.getElementById("btn-imprimir-todas-localidades");
    if (botaoCompatibilidade) botaoCompatibilidade.remove();

    var dashboard = document.getElementById("dashboard-view");
    if (!dashboard) return;
    dashboard.querySelectorAll("button").forEach(function (botao) {
      var texto = normalizar(botao.textContent || "");
      if (texto === "IMPRIMIRCONTATOS" || texto === "IMPRIMIRTODOSOSCONTATOS") {
        botao.remove();
      }
    });
  }

  function renderizarResumoDashboardV6(container, dados) {
    if (!container) return;

    if (typeof window.renderizarResumoDashboard === "function") {
      try {
        window.renderizarResumoDashboard(container, dados || {});
        return;
      } catch (erro) {
        console.error("Falha ao usar renderizador do Dashboard:", erro);
      }
    }

    container.innerHTML = "";
    var entradas = Object.keys(dados || {}).map(function (nome) {
      return { nome: nome, valor: Number(dados[nome]) || 0 };
    }).sort(function (a, b) {
      return b.valor - a.valor || a.nome.localeCompare(b.nome, "pt-BR");
    });

    if (!entradas.length) {
      container.innerHTML = '<p style="color:#94a3b8;margin:0;">Nenhum contato cadastrado.</p>';
      return;
    }

    entradas.slice(0, 15).forEach(function (item) {
      var linha = document.createElement("div");
      linha.style.cssText = "display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #e2e8f0;";
      var nome = document.createElement("span");
      nome.textContent = item.nome;
      var numero = document.createElement("strong");
      numero.textContent = String(item.valor);
      linha.append(nome, numero);
      container.appendChild(linha);
    });
  }

  function aplicarDashboardEstruturadoV6(dados) {
    dados = dados || {};
    var tipos = dados.tipos || { "Telefone": 0, "Ramal": 0, "WhatsApp": 0, "E-mail": 0 };
    var comarcas = dados.comarcas || dados.localidades || {};

    atualizarTexto("total-telefones", Number(dados.total) || 0);
    atualizarTexto("total-comarcas", Number(dados.totalComarcas) || Object.keys(comarcas).length);
    atualizarTexto("total-foruns", Number(dados.totalForuns) || 0);
    atualizarTexto("total-unidades", Number(dados.totalUnidades) || 0);
    atualizarTexto("total-setores", Number(dados.totalSetores) || 0);
    atualizarTexto("total-tipos", 4);

    renderizarResumoDashboardV6(document.getElementById("grafico-tipos"), tipos);
    renderizarResumoDashboardV6(document.getElementById("grafico-localidades"), comarcas);
  }

  function fallbackDashboardPorContatosV6() {
    if (typeof API === "undefined" || typeof API.listarTelefones !== "function") return;
    API.listarTelefones(function (resp) {
      if (resp && resp.sucesso === true && Array.isArray(resp.dados)) {
        window.atualizarDashboardPublico(resp.dados);
      }
    }, function (erro) {
      console.error("Falha ao carregar fallback do Dashboard:", erro);
    });
  }

  function carregarDashboardV6() {
    var view = document.getElementById("dashboard-view");
    if (!view || view.classList.contains("hidden") || dashboardCarregandoV6) return;
    if (typeof API === "undefined" || typeof API.dashboard !== "function") {
      fallbackDashboardPorContatosV6();
      return;
    }

    dashboardCarregandoV6 = true;
    API.dashboard(function (resp) {
      dashboardCarregandoV6 = false;
      if (resp && resp.sucesso === true && resp.dados) {
        aplicarDashboardEstruturadoV6(resp.dados);
        return;
      }
      console.error("Dashboard sem resposta válida:", resp && resp.erro ? resp.erro : resp);
      fallbackDashboardPorContatosV6();
    }, function (erro) {
      dashboardCarregandoV6 = false;
      console.error("Falha ao carregar Dashboard:", erro);
      fallbackDashboardPorContatosV6();
    });
  }

  window.atualizarDashboardPublico = function (dadosRaw) {
    var dados = Array.isArray(dadosRaw) ? dadosRaw : [];
    var porTipo = { "Telefone": 0, "Ramal": 0, "WhatsApp": 0, "E-mail": 0 };
    var porComarca = {};
    var comarcas = new Set();
    var foruns = new Set();
    var unidades = new Set();
    var setores = new Set();

    dados.forEach(function (item) {
      var tipo = tipoContato(campo(item, ["tipo", "TIPO"]));
      if (tipo) porTipo[tipo] += 1;

      var comarca = String(campo(item, ["comarca", "COMARCA", "localidade", "LOCALIDADE"]) || "Não informado").trim();
      var comarcaId = String(campo(item, ["comarcaId", "COMARCA_ID"]) || comarca).trim();
      if (comarcaId) comarcas.add(comarcaId);
      porComarca[comarca] = (porComarca[comarca] || 0) + 1;

      var forumId = String(campo(item, ["forumId", "FORUM_ID", "forum", "FORUM"]) || "").trim();
      var noPaiId = String(campo(item, ["noPaiId", "NO_PAI_ID"]) || "").trim();
      var noId = String(campo(item, ["noId", "NO_ID"]) || "").trim();
      var tipoNo = String(campo(item, ["tipoNo", "TIPO_NO"]) || "").trim();
      if (forumId) foruns.add(forumId);
      if (noPaiId) unidades.add(noPaiId);
      if (noId && tipoNo.toUpperCase() === "SETOR") setores.add(noId);
    });

    atualizarTexto("total-telefones", dados.length);
    atualizarTexto("total-comarcas", comarcas.size);
    atualizarTexto("total-foruns", foruns.size);
    atualizarTexto("total-unidades", unidades.size);
    atualizarTexto("total-setores", setores.size);
    atualizarTexto("total-tipos", 4);

    renderizarResumoDashboardV6(document.getElementById("grafico-tipos"), porTipo);
    renderizarResumoDashboardV6(document.getElementById("grafico-localidades"), porComarca);
  };

  function trocarTextoPainel() {
    var painel = document.getElementById("fc-content");
    if (!painel) return;

    painel.querySelectorAll(".fc-section h3").forEach(function (titulo) {
      var texto = String(titulo.textContent || "").trim();
      if (/^Unidades\s+e\s+Setores$/i.test(texto)) titulo.textContent = "Unidades";
      if (/^Setores\s*\/\s*Sublocalidades$/i.test(texto)) titulo.textContent = "Setores";
    });

    painel.querySelectorAll(".fc-pill").forEach(function (badge) {
      var texto = String(badge.textContent || "").trim();
      var match = texto.match(/^(\d+)\s+sublocalidade\(s\)$/i);
      if (!match) return;
      var quantidade = Number(match[1]);
      if (!quantidade) {
        badge.remove();
        return;
      }
      badge.textContent = quantidade + (quantidade === 1 ? " Setor" : " Setores");
    });
  }

  function capturarComarcasDoPainel() {
    var cards = Array.prototype.slice.call(document.querySelectorAll('#fc-content .fc-card[data-comarca]'));
    if (!cards.length) return;

    var vistos = {};
    var opcoes = [];
    cards.forEach(function (card) {
      var id = String(card.getAttribute("data-comarca") || "").trim();
      if (!id || vistos[id]) return;
      vistos[id] = true;
      var titulo = card.querySelector("h4");
      opcoes.push({ id: id, nome: String(titulo ? titulo.textContent : id).trim() });
    });

    if (opcoes.length) {
      opcoes.sort(function (a, b) { return a.nome.localeCompare(b.nome, "pt-BR"); });
      comarcasPainelV6 = opcoes;
    }
  }

  function carregarComarcasPainelV6() {
    if (comarcasPainelV6.length || carregandoComarcasPainelV6) return;
    if (typeof API === "undefined" || typeof API.hierarquiaForum !== "function") return;

    carregandoComarcasPainelV6 = true;
    API.hierarquiaForum("", function (resp) {
      carregandoComarcasPainelV6 = false;
      var lista = resp && resp.sucesso === true && resp.dados && Array.isArray(resp.dados.comarcas)
        ? resp.dados.comarcas
        : [];
      comarcasPainelV6 = lista.map(function (m) {
        return { id: String(m.id || ""), nome: String(m.nome || m.id || "") };
      }).filter(function (m) { return m.id; }).sort(function (a, b) {
        return a.nome.localeCompare(b.nome, "pt-BR");
      });
      garantirSeletorComarcaPainel();
    }, function () {
      carregandoComarcasPainelV6 = false;
    });
  }

  function detectarComarcaAtualPainel() {
    if (comarcaSelecionadaPainelV6 || !comarcasPainelV6.length) return;
    var painel = document.getElementById("fc-content");
    if (!painel) return;

    var candidatos = [];
    var backComarca = document.getElementById("fc-back-comarca");
    var backNo = document.getElementById("fc-back-no");
    var titulo = painel.querySelector(".fc-head .fc-title");
    var subtitulo = painel.querySelector(".fc-head .fc-subtitle");
    if (backComarca) candidatos.push(backComarca.textContent || "");
    if (backNo) candidatos.push(backNo.textContent || "");
    if (titulo) candidatos.push(titulo.textContent || "");
    if (subtitulo) candidatos.push(subtitulo.textContent || "");

    for (var i = 0; i < comarcasPainelV6.length; i++) {
      var comarca = comarcasPainelV6[i];
      var alvo = normalizar(comarca.nome);
      if (candidatos.some(function (texto) { return normalizar(texto).indexOf(alvo) !== -1; })) {
        comarcaSelecionadaPainelV6 = comarca.id;
        return;
      }
    }
  }

  function navegarParaComarcaPainel(id) {
    comarcaSelecionadaPainelV6 = String(id || "");
    if (!comarcaSelecionadaPainelV6) {
      if (typeof window.fcInicio === "function") window.fcInicio();
      return;
    }

    var destino = Array.prototype.slice.call(document.querySelectorAll('#fc-content .fc-card[data-comarca]')).find(function (card) {
      return String(card.getAttribute("data-comarca") || "") === comarcaSelecionadaPainelV6;
    });
    if (destino) {
      destino.click();
      return;
    }

    if (typeof window.fcInicio === "function") {
      window.fcInicio();
      setTimeout(function () {
        var card = Array.prototype.slice.call(document.querySelectorAll('#fc-content .fc-card[data-comarca]')).find(function (item) {
          return String(item.getAttribute("data-comarca") || "") === comarcaSelecionadaPainelV6;
        });
        if (card) card.click();
      }, 40);
    }
  }

  function garantirSeletorComarcaPainel() {
    var painel = document.getElementById("fc-content");
    if (!painel) return;

    capturarComarcasDoPainel();
    if (!comarcasPainelV6.length) {
      carregarComarcasPainelV6();
      return;
    }
    detectarComarcaAtualPainel();

    var existente = document.getElementById("fc-search");
    if (existente && String(existente.tagName || "").toUpperCase() === "SELECT" && existente.getAttribute("data-demo-comarca-v6") === "true") {
      existente.value = comarcaSelecionadaPainelV6 || "";
      return;
    }

    var select = document.createElement("select");
    select.id = "fc-search";
    select.className = "fc-select fc-comarca-select";
    select.setAttribute("aria-label", "Selecionar comarca");
    select.setAttribute("data-demo-comarca-v6", "true");

    var inicial = document.createElement("option");
    inicial.value = "";
    inicial.textContent = "Selecione uma comarca";
    select.appendChild(inicial);

    comarcasPainelV6.forEach(function (opcao) {
      var el = document.createElement("option");
      el.value = opcao.id;
      el.textContent = opcao.nome;
      select.appendChild(el);
    });

    select.value = comarcaSelecionadaPainelV6 || "";
    select.onchange = function () {
      navegarParaComarcaPainel(select.value);
    };

    if (existente) {
      existente.replaceWith(select);
      return;
    }

    var head = painel.querySelector(".fc-head");
    if (head && head.parentNode) {
      if (head.nextSibling) head.parentNode.insertBefore(select, head.nextSibling);
      else head.parentNode.appendChild(select);
    } else {
      painel.insertBefore(select, painel.firstChild || null);
    }
  }

  function aplicarAjustesContatos() {
    trocarTextoPainel();
  }

  function observarPainel() {
    var painel = document.getElementById("fc-content");
    if (!painel || painel.__demoV6Observer) return;
    painel.__demoV6Observer = true;

    painel.addEventListener("click", function (evento) {
      var alvo = evento.target && evento.target.closest ? evento.target.closest("[data-comarca]") : null;
      if (alvo) comarcaSelecionadaPainelV6 = String(alvo.getAttribute("data-comarca") || "");
    }, true);

    aplicarAjustesContatos();
    new MutationObserver(function () {
      aplicarAjustesContatos();
    }).observe(painel, { childList: true, subtree: true });
  }

  function observarDashboard() {
    var dashboard = document.getElementById("dashboard-view");
    if (!dashboard || dashboard.__demoV6DashboardObserver) return;
    dashboard.__demoV6DashboardObserver = true;
    new MutationObserver(function () {
      if (!dashboard.classList.contains("hidden")) {
        setTimeout(carregarDashboardV6, 0);
      }
    }).observe(dashboard, { attributes: true, attributeFilter: ["class", "style"] });
    if (!dashboard.classList.contains("hidden")) carregarDashboardV6();
  }

  instalarAjustesVisuaisGlobais();
  removerBotoesImpressaoDashboardLegados();
  observarPainel();
  observarDashboard();

  document.addEventListener("DOMContentLoaded", function () {
    instalarAjustesVisuaisGlobais();
    removerBotoesImpressaoDashboardLegados();
    observarPainel();
    observarDashboard();
  });
})();
</script>
