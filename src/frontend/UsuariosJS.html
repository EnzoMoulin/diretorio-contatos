<script>
var escoposUsuarios = [];
var usuarioEmEdicao = null;

function textoEscopoUsuario(escopo) {
  var base = escopo.caminhoTexto || escopo.nome || escopo.id;
  return (typeof escopo.n_contatos === "number") ? base + " (" + escopo.n_contatos + ")" : base;
}

function carregarUsuarios() {
  var filtro=document.getElementById("filtro-usuarios");
  if(filtro&&!filtro.dataset.ligado){filtro.dataset.ligado="1";filtro.oninput=aplicarFiltroUsuarios;}
  API.listarEscoposParaAcesso(function(respEscopos) {
    escoposUsuarios = respEscopos && respEscopos.sucesso === true ? (respEscopos.dados || []) : [];
    preencherSeletorReverso();
    API.listarUsuarios(function(resp) {
      if (!resp || resp.sucesso !== true) { mostrarToast((resp && resp.erro) || "Erro ao carregar usuários.", "error"); return; }
      renderizarUsuarios(resp.dados || []);
    }, function(erro) { mostrarToast((erro && erro.message) || "Falha de comunicação.", "error"); });
  }, function(erro) { mostrarToast((erro && erro.message) || "Falha ao carregar escopos de acesso.", "error"); });
}
function preencherSeletorReverso() {
  var select = document.getElementById("reverso-no"); if (!select) return; select.textContent = "";
  var vazio = document.createElement("option"); vazio.value = ""; vazio.textContent = "Selecione Fórum, Unidade ou Setor…"; select.appendChild(vazio);
  escoposUsuarios.filter(function(i) { return i.tipo === "FORUM" || i.tipo === "UNIDADE" || i.tipo === "SETOR"; }).forEach(function(item) {
    var op = document.createElement("option"); op.value = item.id; op.textContent = textoEscopoUsuario(item); select.appendChild(op);
  });
}
function consultarAcessoNo() {
  var select = document.getElementById("reverso-no"); var saida = document.getElementById("reverso-resultado");
  if (!select || !saida) return;
  if (!select.value) { saida.textContent = "Selecione um nó."; return; }
  saida.textContent = "Consultando…";
  API.consultarUsuariosPorNo(select.value, function(resp) {
    if (!resp || resp.sucesso !== true) { saida.textContent = (resp && resp.erro) || "Falha na consulta."; return; }
    var dados = resp.dados || {}; var usuarios = dados.usuarios || [];
    if (!usuarios.length) { saida.textContent = "Nenhum gestor alcança " + ((dados.no && dados.no.nome) || select.value) + "."; return; }
    saida.textContent = "";
    var titulo = document.createElement("div"); titulo.innerHTML = "<strong>" + usuarios.length + "</strong> gestor(es) com acesso a <strong>" + ((dados.no && dados.no.nome) || "") + "</strong>:"; saida.appendChild(titulo);
    var ul = document.createElement("ul"); ul.style.margin = "6px 0 0 18px";
    usuarios.forEach(function(u) {
      var li = document.createElement("li");
      li.textContent = (u.nome || u.email) + " <" + u.email + "> — via " + (u.vias || []).map(function(v) { return v.nome || v.id; }).join(", ");
      ul.appendChild(li);
    });
    saida.appendChild(ul);
  }, function(erro) { saida.textContent = (erro && erro.message) || "Falha de comunicação."; });
}

function renderizarUsuarios(lista) {
  listaUsuariosAtual = Array.isArray(lista) ? lista.slice() : [];
  aplicarFiltroUsuarios();
}
function normalizarBuscaUsuarios(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function formatarUltimaAtividade(ts){
  if(!ts) return "—";
  try { return new Date(Number(ts)).toLocaleDateString("pt-BR"); } catch (e) { return "—"; }
}
function aplicarFiltroUsuarios(){
  var termo = normalizarBuscaUsuarios(document.getElementById("filtro-usuarios") ? document.getElementById("filtro-usuarios").value : "");
  var lista = listaUsuariosAtual.filter(function(usuario){
    if(!termo) return true;
    return normalizarBuscaUsuarios(usuario.nome).indexOf(termo) >= 0 || normalizarBuscaUsuarios(usuario.email).indexOf(termo) >= 0;
  });
  lista.sort(function(a, b){ return (a.ultimaAtividade || 0) - (b.ultimaAtividade || 0); });
  var tbody = document.getElementById("corpo-tabela-usuarios"); if (!tbody) return; tbody.textContent = "";
  if (!lista.length) { var tr0 = document.createElement("tr"), td0 = document.createElement("td"); td0.colSpan = 5; td0.textContent = normalizarBuscaUsuarios(document.getElementById("filtro-usuarios") ? document.getElementById("filtro-usuarios").value : "") ? "Nenhum usuário para este filtro." : "Nenhum usuário cadastrado."; tr0.appendChild(td0); tbody.appendChild(tr0); return; }
  lista.forEach(function(usuario) {
    var tr = document.createElement("tr"); tr.tabIndex = 0; tr.style.cursor = "pointer"; tr.title = "Clique para gerenciar este usuário";
    function celula(texto) { var td = document.createElement("td"); td.textContent = texto || "-"; tr.appendChild(td); }
    celula(usuario.nome); celula(usuario.email);
    celula(usuario.nivel === 1 ? "Gestor de Conteúdo" : "Administrador");
    celula(usuario.ativo === true ? "Sim" : "Não");
    celula(formatarUltimaAtividade(usuario.ultimaAtividade));
    tr.onclick = function() { abrirModalEditarUsuario(usuario); };
    tr.onkeydown = function(evento) { if (evento.key === "Enter" || evento.key === " ") { evento.preventDefault(); abrirModalEditarUsuario(usuario); } };
    tbody.appendChild(tr);
  });
}

var listaUsuariosAtual=[];
var escoposUsuarioSelecionados = new Set();
var forumUsuarioAberto = "";
var unidadeUsuarioAberta = "";
function chaveEscopoUsuario(escopo) { return escopo.tipo + ":" + escopo.id; }
function prepararSeletorLocalidadesUsuario(selecionados) {
  escoposUsuarioSelecionados = new Set((selecionados || []).map(chaveEscopoUsuario));
  forumUsuarioAberto = "";
  var select = document.getElementById("usuario-comarca"); if (!select) return; select.textContent = "";
  var comarcas = [];
  escoposUsuarios.forEach(function(escopo) { if (escopo.comarca && comarcas.indexOf(escopo.comarca) < 0) comarcas.push(escopo.comarca); });
  var inicial = document.createElement("option"); inicial.value = ""; inicial.textContent = "Selecione uma comarca"; select.appendChild(inicial);
  comarcas.forEach(function(nome) { var opcao = document.createElement("option"); opcao.value = nome; opcao.textContent = nome; select.appendChild(opcao); });
  var primeiroSelecionado = escoposUsuarios.find(function(escopo) { return escoposUsuarioSelecionados.has(chaveEscopoUsuario(escopo)); });
  select.value = primeiroSelecionado ? primeiroSelecionado.comarca : (comarcas[0] || "");
  renderizarSeletorLocalidadesUsuario();
}
function marcarEscopoUsuario(escopo, marcado) {
  var chave = chaveEscopoUsuario(escopo);
  if (marcado) {
  escoposUsuarioSelecionados.add(chave);
  if (escopo.tipo === "FORUM") escoposUsuarios.filter(function(item) { return (item.tipo === "UNIDADE" || item.tipo === "SETOR") && item.forumId === escopo.forumId; }).forEach(function(item) { escoposUsuarioSelecionados.delete(chaveEscopoUsuario(item)); });
  if (escopo.tipo === "UNIDADE") escoposUsuarios.filter(function(item) { return item.tipo === "SETOR" && item.paiId === escopo.id; }).forEach(function(item) { escoposUsuarioSelecionados.delete(chaveEscopoUsuario(item)); });
  } else escoposUsuarioSelecionados.delete(chave);
  renderizarSeletorLocalidadesUsuario();
}
function renderizarSeletorLocalidadesUsuario() {
  var comarca = document.getElementById("usuario-comarca"); var holder = document.getElementById("usuario-localidades"); if (!comarca || !holder) return; holder.textContent = "";
  var foruns = escoposUsuarios.filter(function(item) { return item.tipo === "FORUM" && item.comarca === comarca.value; });
  if (!foruns.length) { holder.textContent = "Selecione uma comarca para visualizar os Fóruns."; return; }
  var titulo = document.createElement("strong"); titulo.textContent = "Fóruns"; holder.appendChild(titulo);
  foruns.forEach(function(forum) {
    var linha = document.createElement("div"); linha.style.marginTop = "10px";
    var check = document.createElement("input"); check.type = "checkbox"; check.checked = escoposUsuarioSelecionados.has(chaveEscopoUsuario(forum)); check.onchange = function() { marcarEscopoUsuario(forum, check.checked); };
    var nome = document.createElement("button"); nome.type = "button"; nome.className = "btn"; nome.style.marginLeft = "8px"; nome.textContent = textoEscopoUsuario(forum); nome.onclick = function() { forumUsuarioAberto = forumUsuarioAberto === forum.id ? "" : forum.id; renderizarSeletorLocalidadesUsuario(); };
    linha.appendChild(check); linha.appendChild(nome); holder.appendChild(linha);
    if (forumUsuarioAberto === forum.id) {
      var subtitulo = document.createElement("strong"); subtitulo.textContent = "Unidades"; subtitulo.style.cssText = "display:block;margin:8px 0 4px 28px"; holder.appendChild(subtitulo);
      escoposUsuarios.filter(function(item) { return item.tipo === "UNIDADE" && item.forumId === forum.forumId; }).forEach(function(unidade) {
        var unidadeLinha = document.createElement("div"); unidadeLinha.style.cssText = "display:block;margin:5px 0 5px 28px";
        var unidadeCheck = document.createElement("input"); unidadeCheck.type = "checkbox"; unidadeCheck.checked = escoposUsuarioSelecionados.has(chaveEscopoUsuario(unidade)); unidadeCheck.disabled = check.checked; unidadeCheck.onchange = function() { marcarEscopoUsuario(unidade, unidadeCheck.checked); };
        unidadeLinha.appendChild(unidadeCheck);
        var unidadeNome = document.createElement("button"); unidadeNome.type = "button"; unidadeNome.className = "btn"; unidadeNome.style.marginLeft = "8px"; unidadeNome.textContent = " " + textoEscopoUsuario(unidade); unidadeNome.onclick = function() { unidadeUsuarioAberta = unidadeUsuarioAberta === unidade.id ? "" : unidade.id; renderizarSeletorLocalidadesUsuario(); };
        unidadeLinha.appendChild(unidadeNome); holder.appendChild(unidadeLinha);
        if (unidadeUsuarioAberta === unidade.id) {
          escoposUsuarios.filter(function(item) { return item.tipo === "SETOR" && item.paiId === unidade.id; }).forEach(function(setor) {
            var setorLinha = document.createElement("label"); setorLinha.style.cssText = "display:block;margin:4px 0 4px 56px";
            var setorCheck = document.createElement("input"); setorCheck.type = "checkbox"; setorCheck.checked = escoposUsuarioSelecionados.has(chaveEscopoUsuario(setor)); setorCheck.disabled = check.checked || unidadeCheck.checked; setorCheck.onchange = function() { marcarEscopoUsuario(setor, setorCheck.checked); };
            setorLinha.appendChild(setorCheck); setorLinha.appendChild(document.createTextNode(" " + textoEscopoUsuario(setor))); holder.appendChild(setorLinha);
          });
        }
      });
    }
  });
}

function abrirModalAdicionarUsuario() {
  usuarioEmEdicao = null;
  document.getElementById("titulo-modal-usuario").textContent = "Adicionar usuário";
  document.getElementById("usuario-email").value = ""; document.getElementById("usuario-email").disabled = false;
  document.getElementById("usuario-nome").value = ""; document.getElementById("usuario-nivel").value = "1"; document.getElementById("usuario-ativo").checked = true;
  document.getElementById("btn-excluir-usuario").classList.add("hidden"); document.getElementById("btn-salvar-usuario").textContent = "Selecionar comarcas";
  prepararSeletorLocalidadesUsuario([]); alternarEscoposUsuario(); document.getElementById("modal-usuario").classList.remove("hidden");
}

function abrirModalEditarUsuario(usuario) {
  usuarioEmEdicao = usuario;
  document.getElementById("titulo-modal-usuario").textContent = "Gerenciar usuário";
  document.getElementById("usuario-email").value = usuario.email || ""; document.getElementById("usuario-email").disabled = true;
  document.getElementById("usuario-nome").value = usuario.nome || ""; document.getElementById("usuario-nivel").value = String(usuario.nivel || 1); document.getElementById("usuario-ativo").checked = usuario.ativo === true;
  document.getElementById("btn-excluir-usuario").classList.remove("hidden"); document.getElementById("btn-salvar-usuario").textContent = "Gerenciar comarcas";
  prepararSeletorLocalidadesUsuario(usuario.escopos || []); alternarEscoposUsuario(); document.getElementById("modal-usuario").classList.remove("hidden");
}

function fecharModalUsuario() { document.getElementById("modal-usuario").classList.add("hidden"); document.getElementById("modal-localidades-usuario").classList.add("hidden"); usuarioEmEdicao = null; }
function alternarEscoposUsuario() { var nivel = Number(document.getElementById("usuario-nivel").value || 0); var botao = document.getElementById("btn-salvar-usuario"); if (botao) botao.textContent = nivel === 1 ? (usuarioEmEdicao ? "Gerenciar comarcas" : "Selecionar comarcas") : (usuarioEmEdicao ? "Salvar" : "Adicionar"); }
function obterEscoposSelecionadosUsuario() { return Array.from(escoposUsuarioSelecionados).map(function(chave) { var partes = chave.split(":"); return { tipo: partes[0], id: partes.slice(1).join(":") }; }); }
function acaoPrincipalUsuario() { if (Number(document.getElementById("usuario-nivel").value || 0) === 1) abrirEtapaLocalidadesUsuario(); else salvarUsuarioModal(); }
function abrirEtapaLocalidadesUsuario() { var nome = String(document.getElementById("usuario-nome").value || "").trim(); var email = document.getElementById("usuario-email"); if (!nome) { mostrarToast("Informe o nome do usuário antes de selecionar comarcas.", "warning"); document.getElementById("usuario-nome").focus(); return; } if (!email.value.trim() || !email.checkValidity()) { mostrarToast("Informe um e-mail válido antes de selecionar comarcas.", "warning"); email.focus(); return; } document.getElementById("modal-usuario").classList.add("hidden"); document.getElementById("btn-confirmar-localidades-usuario").textContent = usuarioEmEdicao ? "Salvar" : "Concluir cadastro"; document.getElementById("modal-localidades-usuario").classList.remove("hidden"); }
function voltarParaDadosUsuario() { document.getElementById("modal-localidades-usuario").classList.add("hidden"); document.getElementById("modal-usuario").classList.remove("hidden"); }

function salvarUsuarioModal() {
  var email = String(document.getElementById("usuario-email").value || "").trim(); var nome = String(document.getElementById("usuario-nome").value || "").trim(); var nivel = Number(document.getElementById("usuario-nivel").value || 0); var ativo = document.getElementById("usuario-ativo").checked === true; var escopos = obterEscoposSelecionadosUsuario();
  if (nivel === 1 && !escopos.length) { mostrarToast("Selecione ao menos um escopo para o Gestor de Conteúdo.", "warning"); return; }
  var botao = document.getElementById("btn-confirmar-localidades-usuario"); if (Number(document.getElementById("usuario-nivel").value || 0) !== 1) botao = document.getElementById("btn-salvar-usuario"); botao.disabled = true;
  var dados = { nome: nome, nivel: nivel, ativo: ativo, escopos: escopos };
  var editando = !!usuarioEmEdicao;
  var concluir = function(resp) { botao.disabled = false; if (resp && resp.sucesso === true) { fecharModalUsuario(); mostrarToast(editando ? "Usuário atualizado." : "Usuário criado.", "success"); carregarUsuarios(); } else mostrarToast((resp && resp.erro) || "Falha ao salvar usuário.", "error"); };
  var falhar = function(erro) { botao.disabled = false; mostrarToast((erro && erro.message) || "Falha de comunicação.", "error"); };
  if (editando) API.atualizarUsuario(usuarioEmEdicao.email, dados, concluir, falhar); else { dados.email = email; API.criarUsuario(dados, concluir, falhar); }
}

function excluirUsuarioAtual() {
  if (!usuarioEmEdicao) return;
  confirmarAcaoSistema({ titulo: "Excluir acesso administrativo", mensagem: "Excluir o acesso de " + usuarioEmEdicao.email + "?", textoConfirmar: "Excluir acesso", perigo: true, icone: "🗑" }).then(function(confirmado) {
    if (!confirmado || !usuarioEmEdicao) return;
    var botao = document.getElementById("btn-excluir-usuario"); botao.disabled = true;
    API.excluirUsuario(usuarioEmEdicao.email, function(resp) { botao.disabled = false; if (resp && resp.sucesso === true) { fecharModalUsuario(); mostrarToast("Usuário excluído.", "success"); carregarUsuarios(); } else mostrarToast((resp && resp.erro) || "Falha ao excluir.", "error"); }, function(erro) { botao.disabled = false; mostrarToast((erro && erro.message) || "Falha de comunicação.", "error"); });
  });
}
</script>
