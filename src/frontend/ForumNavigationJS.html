/*
==========================================================
NAVEGAÇÃO DE CONTATOS — COMARCA > FÓRUM > UNIDADE > SETOR
(port da v2 Python: mesma UI; dados via google.script.run)
==========================================================
*/
<script>
(function () {
  "use strict";

  var sel = { com: "", for: "", uni: "", set: "" };
  var coms = [];
  var IDX = { forum: {}, unidade: {}, setor: {} };

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }

  function api(nome) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(function (r) {
          if (r && r.sucesso) resolve(r.dados);
          else reject(new Error((r && r.erro) || "falha no servidor"));
        })
        .withFailureHandler(function (e) { reject(e); });
      runner[nome].apply(runner, args);
    });
  }

  function optLabel(selId) {
    var s = $(selId);
    return s && s.selectedIndex > 0 ? s.options[s.selectedIndex].text : "";
  }

  function nomeLimpo(selId) {
    return optLabel(selId).replace(/ \(\d+\)( ✓)?$/, "").replace(/ ✓$/, "");
  }

  /* ---- índice client-side a partir da hierarquia ---- */
  function indexar(dados) {
    coms = [];
    IDX = { forum: {}, unidade: {}, setor: {} };
    (dados.municipios || []).forEach(function (m) {
      var com = { id: m.id, nome: m.nome, total: m.qtdContatos || 0,
        n_foruns: (m.foruns || []).length, n_unidades: 0, n_setores: 0 };
      (m.foruns || []).forEach(function (f) {
        var fr = { id: f.id, nome: f.nome, comarca_id: m.id, endereco: f.endereco,
          total: f.qtdContatos || 0, n_unidades: 0, n_setores: 0 };
        IDX.forum[f.id] = fr;
        (f.nos || []).forEach(function (no) { indexarNo(no, fr, null); });
        fr.n_unidades = Object.keys(IDX.unidade).filter(function (k) { return IDX.unidade[k].forum_id === f.id; }).length;
        fr.n_setores = Object.keys(IDX.setor).filter(function (k) { return IDX.setor[k].forum_id === f.id; }).length;
        com.n_unidades += fr.n_unidades;
        com.n_setores += fr.n_setores;
      });
      coms.push(com);
    });
  }

  function indexarNo(no, fr, paiUni) {
    var tipo = String(no.tipo || "").toUpperCase();
    if (tipo === "UNIDADE") {
      var u = { id: no.id, nome: no.nome, forum_id: fr.id, comarca_id: fr.comarca_id,
        total: no.qtdContatos || 0, n_setores: 0 };
      IDX.unidade[no.id] = u;
      (no.filhos || []).forEach(function (f) { indexarNo(f, fr, u); });
      u.n_setores = Object.keys(IDX.setor).filter(function (k) { return IDX.setor[k].unidade_id === no.id; }).length;
    } else {
      var s = { id: no.id, nome: no.nome, forum_id: fr.id,
        unidade_id: paiUni ? paiUni.id : "", comarca_id: fr.comarca_id,
        total: no.qtdContatos || 0, contatos: no.contatos || [] };
      IDX.setor[no.id] = s;
      (no.filhos || []).forEach(function (f) { indexarNo(f, fr, paiUni); });
    }
  }

  function contatosDo(filtro) {
    var out = [];
    Object.keys(IDX.setor).forEach(function (k) {
      var s = IDX.setor[k];
      if (filtro.comarca_id && String(s.comarca_id) !== String(filtro.comarca_id)) return;
      if (filtro.forum_id && String(s.forum_id) !== String(filtro.forum_id)) return;
      if (filtro.unidade_id && String(s.unidade_id) !== String(filtro.unidade_id)) return;
      if (filtro.setor_id && String(s.id) !== String(filtro.setor_id)) return;
      (s.contatos || []).forEach(function (c) {
        out.push({ id: c.id, setor_id: s.id, unidade_id: s.unidade_id, forum_id: s.forum_id,
          comarca_id: s.comarca_id, setor: s.nome,
          unidade: (IDX.unidade[s.unidade_id] || {}).nome || "",
          forum: (IDX.forum[s.forum_id] || {}).nome || "",
          comarca: (coms.filter(function (x) { return String(x.id) === String(s.comarca_id); })[0] || {}).nome || "",
          tipo: c.tipo, descricao: c.descricao, valor: c.valor });
      });
    });
    return out;
  }

  /* ---- navegação ---- */
  function ensureSelRow() {
    var box = $("fc-content");
    if (!$("sel-row") && box) {
      var row = document.createElement("div");
      row.className = "fc-selects-row";
      row.id = "sel-row";
      row.innerHTML =
        '<select id="sel-com" class="fc-select" aria-label="Comarca"><option value="">Selecione a Comarca/Órgão</option></select>' +
        '<select id="sel-for" class="fc-select hidden" aria-label="Fórum" disabled><option value="">Fórum…</option></select>' +
        '<select id="sel-uni" class="fc-select hidden" aria-label="Unidade" disabled><option value="">Unidade…</option></select>' +
        '<select id="sel-set" class="fc-select hidden" aria-label="Setor" disabled><option value="">Setor…</option></select>';
      box.parentNode.insertBefore(row, box);
      $("sel-com").onchange = function () { onCom(); };
      $("sel-for").onchange = function () { onFor(); };
      $("sel-uni").onchange = function () { onUni(); };
      $("sel-set").onchange = function () { onSet(); };
    }
  }

  function ensureBottomNav() {
    if ($("fc-bottom-nav")) return;
    var panel = document.querySelector(".fc-panel");
    if (!panel) return;
    var nav = document.createElement("div");
    nav.className = "fc-bottom-nav";
    nav.id = "fc-bottom-nav";
    nav.innerHTML =
      '<div class="nav-group"><button type="button" class="fc-back hidden" id="btn-voltar">← Voltar</button>' +
      '<button type="button" class="fc-back hidden" id="btn-topo">↑ Voltar ao topo</button></div>' +
      '<button type="button" class="fc-btn hidden" id="btn-print">🖨️ Imprimir / Salvar PDF</button>';
    panel.appendChild(nav);
    $("btn-voltar").onclick = function () {
      if (sel.set) navTo(sel.com, sel.for, sel.uni);
      else if (sel.uni) navTo(sel.com, sel.for);
      else if (sel.for) navTo(sel.com);
      else if (sel.com) navTo("");
    };
    $("btn-topo").onclick = function () {
      document.querySelector(".fc-panel").scrollTo({ top: 0, behavior: "smooth" });
    };
    $("btn-print").onclick = imprimirEscopo;
  }

  function refreshBottomNav() {
    var bv = $("btn-voltar"), bt = $("btn-topo"), bp = $("btn-print");
    if (!bv) return;
    bv.classList.toggle("hidden", !(sel.com || sel.for || sel.uni || sel.set));
    bp.classList.toggle("hidden", !sel.com);
    var panel = document.querySelector(".fc-panel");
    bt.classList.toggle("hidden", !(panel && panel.scrollHeight > panel.clientHeight + 1));
  }

  function loadComs() {
    var s = $("sel-com");
    if (!s) return;
    s.innerHTML = '<option value="">Selecione a Comarca/Órgão</option>' +
      coms.map(function (c) {
        return '<option value="' + esc(c.id) + '">' + esc(c.nome) + " (" + (c.total || 0) + ")</option>";
      }).join("");
  }

  function onCom(skip) {
    sel.com = $("sel-com").value; sel.for = ""; sel.uni = ""; sel.set = "";
    var sf = $("sel-for"), su = $("sel-uni"), ss = $("sel-set");
    sf.innerHTML = '<option value="">Fórum…</option>';
    su.innerHTML = '<option value="">Unidade…</option>';
    ss.innerHTML = '<option value="">Setor…</option>';
    su.disabled = true; ss.disabled = true;
    if (sel.com) {
      var fors = Object.keys(IDX.forum).map(function (k) { return IDX.forum[k]; })
        .filter(function (f) { return String(f.comarca_id) === String(sel.com); });
      sf.innerHTML += fors.map(function (f) {
        return '<option value="' + esc(f.id) + '">' + esc(f.nome) + "</option>";
      }).join("");
      sf.disabled = false;
    } else sf.disabled = true;
    if (!skip) sync();
  }

  function onFor(skip) {
    sel.for = $("sel-for").value; sel.uni = ""; sel.set = "";
    var su = $("sel-uni"), ss = $("sel-set");
    su.innerHTML = '<option value="">Unidade…</option>';
    ss.innerHTML = '<option value="">Setor…</option>';
    ss.disabled = true;
    if (sel.for) {
      var unis = Object.keys(IDX.unidade).map(function (k) { return IDX.unidade[k]; })
        .filter(function (u) { return String(u.forum_id) === String(sel.for); });
      su.innerHTML += unis.map(function (u) {
        return '<option value="' + esc(u.id) + '">' + esc(u.nome) + "</option>";
      }).join("");
      su.disabled = false;
    } else su.disabled = true;
    if (!skip) sync();
  }

  function onUni(skip) {
    sel.uni = $("sel-uni").value; sel.set = "";
    var ss = $("sel-set");
    ss.innerHTML = '<option value="">Setor…</option>';
    if (sel.uni) {
      var sets = Object.keys(IDX.setor).map(function (k) { return IDX.setor[k]; })
        .filter(function (x) { return String(x.unidade_id) === String(sel.uni); });
      ss.innerHTML += sets.map(function (x) {
        return '<option value="' + esc(x.id) + '">' + esc(x.nome) + "</option>";
      }).join("");
      ss.disabled = false;
    } else ss.disabled = true;
    if (!skip) sync();
  }

  function onSet(skip) {
    sel.set = $("sel-set").value;
    if (!skip) sync();
  }

  function navTo(com, fr, uni, set) {
    $("sel-com").value = com || "";
    onCom(true);
    if (fr) { $("sel-for").value = fr; onFor(true); }
    if (uni) { $("sel-uni").value = uni; onUni(true); }
    if (set) $("sel-set").value = set;
    onSet(true);
    sync();
  }

  function chainHtml() {
    if (!sel.com) return "";
    var com = esc(nomeLimpo("sel-com"));
    var fr = sel.for ? esc(nomeLimpo("sel-for")) : "";
    var uni = sel.uni ? esc(nomeLimpo("sel-uni")) : "";
    var set = sel.set ? esc(nomeLimpo("sel-set")) : "";
    var deep = sel.for || sel.uni || sel.set;
    return '<nav class="fc-breadcrumb">' +
      (deep ? '<button type="button" data-c="com">' + com + "</button> › " : "<span>" + com + "</span>") +
      (sel.for ? ((sel.uni || sel.set) ? '<button type="button" data-c="for">' + fr + "</button> › " : "<span>" + fr + "</span>") : "") +
      (sel.uni ? (sel.set ? '<button type="button" data-c="uni">' + uni + "</button> › " : "<span>" + uni + "</span>") : "") +
      (sel.set ? '<span class="fc-breadcrumb-current">' + set + "</span>" : "") +
      "</nav>";
  }

  function bindChain(scope) {
    if (!scope || !scope.querySelectorAll) return;
    scope.querySelectorAll("[data-c]").forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.c === "com") navTo(sel.com);
        else if (b.dataset.c === "for") navTo(sel.com, sel.for);
        else navTo(sel.com, sel.for, sel.uni);
      };
    });
  }

  var pill = function (n, s, p) {
    return '<span class="fc-pill">' + n + " " + (n == 1 ? s : p) + "</span>";
  };

  function cardNivel(tipo, id, nome, meta) {
    return '<div class="fc-card" data-nav="' + tipo + '" data-id="' + esc(id) + '">' +
      '<div class="fc-card-head"><div><h4>' + esc(nome) + "</h4></div></div>" +
      '<div class="fc-meta">' + meta + "</div></div>";
  }

  function valorLink(c) {
    var v = String(c.valor || "");
    var t = String(c.tipo || "").toUpperCase().replace(/[^A-Z]/g, "");
    if (!v) return "";
    if (t === "EMAIL") return '<a class="fc-contato-valor" href="mailto:' + esc(v) + '">' + esc(v) + "</a>";
    if (t === "TELEFONE" || t === "RAMAL") {
      var tel = v.replace(/\D/g, "");
      return '<a class="fc-contato-valor" href="tel:' + esc(tel) + '">' + esc(v) + "</a>";
    }
    if (t === "WHATSAPP") {
      var zap = v.replace(/\D/g, "");
      return '<a class="fc-contato-valor" href="https://wa.me/55' + esc(zap) + '" target="_blank" rel="noopener">' + esc(v) + "</a>";
    }
    return '<span class="fc-contato-valor">' + esc(v) + "</span>";
  }

  function cardContato(c, caminho) {
    return '<div class="fc-contato"><div class="fc-contato-main">' +
      '<span class="fc-contato-tipo">' + esc(c.descricao || c.tipo || "") + (caminho ? " · " + esc(caminho) : "") + "</span>" +
      "<h4>" + esc(c.descricao || c.tipo || "") + "</h4></div>" +
      '<div class="fc-contato-side">' + valorLink(c) +
      '<button type="button" class="fc-copy-btn" data-copy="' + esc(c.valor) + '" title="Copiar">⧉</button></div></div>';
  }

  function printRow(c, caminho) {
    return '<div class="fc-contato"><div class="fc-contato-main">' +
      '<span class="fc-contato-tipo">' + esc(c.descricao || c.tipo || "") + (caminho ? " · " + esc(caminho) : "") + "</span>" +
      "<h4>" + esc(c.descricao || "") + "</h4></div><div class=\"fc-contato-side\">" +
      (c.valor ? '<span class="fc-contato-valor">' + esc(c.valor) + "</span>" : "") + "</div></div>";
  }

  function imprimirEscopo() {
    var filtro = {}, titulo = "";
    if (sel.set) { filtro.setor_id = sel.set; titulo = nomeLimpo("sel-set"); }
    else if (sel.uni) { filtro.unidade_id = sel.uni; titulo = nomeLimpo("sel-uni"); }
    else if (sel.for) { filtro.forum_id = sel.for; titulo = nomeLimpo("sel-for"); }
    else if (sel.com) { filtro.comarca_id = sel.com; titulo = nomeLimpo("sel-com"); }
    else return;
    var ctts = contatosDo(filtro);
    var area = $("print-area");
    if (!area) {
      area = document.createElement("div");
      area.id = "print-area";
      area.style.display = "none";
      document.body.appendChild(area);
    }
    area.innerHTML = "<h2>" + esc(titulo) + "</h2><p>" + ctts.length + " contato(s)</p>" +
      ctts.map(function (c) {
        return printRow(c, sel.set ? "" : c.comarca + " · " + c.forum + " · " + c.unidade + " · " + c.setor);
      }).join("");
    window.print();
  }

  function sync() {
    var row = $("sel-row");
    if (row) row.classList.toggle("hidden", !!(sel.for || sel.uni || sel.set));
    if (typeof destacarComarcaMapa === "function") {
      var com = coms.filter(function (x) { return String(x.id) === String(sel.com); })[0];
      destacarComarcaMapa(sel.com && com ? com.nome : "");
    }
    buscar();
    refreshBottomNav();
  }

  function buscar() {
    var box = $("fc-content");
    if (!box) return;
    if (!sel.set && !sel.uni && !sel.for && !sel.com) {
      box.innerHTML = (coms.length ? '<span class="fc-pill fc-total-localidades">' + coms.length + (coms.length == 1 ? " Comarca" : " Comarcas") + "</span>" : "") +
      '<div class="fc-section"><h3>Comarcas e órgãos</h3>' + coms.map(function (c) {
        return cardNivel("com", c.id, c.nome,
          pill(c.n_foruns || 0, "Fórum", "Fóruns") +
          pill(c.n_unidades || 0, "Unidade", "Unidades") +
          pill(c.n_setores || 0, "Setor", "Setores") +
          pill(c.total || 0, "contato", "contatos"));
      }).join("") + "</div>";
    } else if (!sel.set && !sel.uni && !sel.for && sel.com) {
      var fors = Object.keys(IDX.forum).map(function (k) { return IDX.forum[k]; })
        .filter(function (f) { return String(f.comarca_id) === String(sel.com); });
      var ctts = contatosDo({ comarca_id: sel.com });
      var porFor = {};
      ctts.forEach(function (c) { porFor[c.forum_id] = (porFor[c.forum_id] || 0) + 1; });
      var com = coms.filter(function (x) { return String(x.id) === String(sel.com); })[0] || {};
      var nUni = fors.reduce(function (a, f) { return a + (f.n_unidades || 0); }, 0);
      var nSet = fors.reduce(function (a, f) { return a + (f.n_setores || 0); }, 0);
      box.innerHTML = '<button class="fc-back" data-back="home">← Comarcas</button>' +
        '<div class="fc-head"><div><h2 class="fc-title">' + esc(com.nome || "") + "</h2>" +
        "<p class=\"fc-subtitle\">" + fors.length + " Fóruns · " + nUni + " Unidades · " + nSet + " Setores · " + ctts.length + " Contatos</p></div></div>" +
        '<div class="fc-section"><h3>Fóruns e órgãos</h3>' +
        fors.map(function (f) {
          return cardNivel("for", f.id, f.nome,
            '<span class="fc-pill fc-pill-type">Fórum</span>' +
            pill(f.n_unidades || 0, "Unidade", "Unidades") +
            pill(f.n_setores || 0, "Setor", "Setores") +
            pill(porFor[f.id] || 0, "contato", "contatos"));
        }).join("") + "</div>";
    } else if (!sel.set && !sel.uni && sel.for) {
      var unis = Object.keys(IDX.unidade).map(function (k) { return IDX.unidade[k]; })
        .filter(function (u) { return String(u.forum_id) === String(sel.for); });
      var ctts2 = contatosDo({ forum_id: sel.for });
      var porUni = {};
      ctts2.forEach(function (c) { porUni[c.unidade_id] = (porUni[c.unidade_id] || 0) + 1; });
      var nSet2 = unis.reduce(function (a, u) { return a + (u.n_setores || 0); }, 0);
      box.innerHTML = '<button class="fc-back" data-back="com">← ' + esc(nomeLimpo("sel-com")) + "</button>" +
        '<div class="fc-head"><div><h2 class="fc-title">' + esc(nomeLimpo("sel-for")) + "</h2>" +
        "<p class=\"fc-subtitle\">" + unis.length + " Unidades · " + nSet2 + " Setores · " + ctts2.length + " Contatos</p></div></div>" +
        chainHtml() +
        '<div class="fc-section"><h3>Unidades</h3>' +
        unis.map(function (u) {
          return cardNivel("uni", u.id, u.nome,
            '<span class="fc-pill fc-pill-type">Unidade</span>' +
            pill(u.n_setores || 0, "Setor", "Setores") +
            pill(porUni[u.id] || 0, "contato", "contatos"));
        }).join("") + "</div>";
    } else if (!sel.set && sel.uni) {
      var sets = Object.keys(IDX.setor).map(function (k) { return IDX.setor[k]; })
        .filter(function (x) { return String(x.unidade_id) === String(sel.uni); });
      var ctts3 = contatosDo({ unidade_id: sel.uni });
      var porSet = {};
      ctts3.forEach(function (c) { porSet[c.setor_id] = (porSet[c.setor_id] || 0) + 1; });
      box.innerHTML = '<button class="fc-back" data-back="for">← ' + esc(nomeLimpo("sel-for")) + "</button>" +
        '<div class="fc-head"><div><h2 class="fc-title">' + esc(nomeLimpo("sel-uni")) + "</h2>" +
        "<p class=\"fc-subtitle\">" + sets.length + " Setores · " + ctts3.length + " Contatos</p></div></div>" +
        chainHtml() +
        '<div class="fc-section"><h3>Setores</h3>' +
        sets.map(function (s) {
          return cardNivel("set", s.id, s.nome,
            '<span class="fc-pill fc-pill-type">Setor</span>' +
            pill(porSet[s.id] || 0, "contato", "contatos"));
        }).join("") + "</div>";
    } else {
      var filtro = {};
      if (sel.set) filtro.setor_id = sel.set;
      else if (sel.uni) filtro.unidade_id = sel.uni;
      else if (sel.for) filtro.forum_id = sel.for;
      else if (sel.com) filtro.comarca_id = sel.com;
      var ctts4 = contatosDo(filtro);
      box.innerHTML = (sel.set
        ? '<button class="fc-back" data-back="uni">← ' + esc(nomeLimpo("sel-uni")) + "</button>" +
          '<div class="fc-head"><div><h2 class="fc-title">' + esc(nomeLimpo("sel-set")) + "</h2></div></div>" +
          chainHtml() +
          '<div><span class="fc-pill fc-pill-type">Setor</span></div>'
        : "") +
        '<div class="fc-section"><h3>Contatos deste setor</h3>' +
        ctts4.map(function (c) {
          return cardContato(c, sel.set ? "" : c.comarca + " · " + c.forum + " · " + c.unidade + " · " + c.setor);
        }).join("") + "</div>";
    }
    bindLista(box);
    refreshBottomNav();
  }

  function bindLista(box) {
    bindChain(box);
    box.querySelectorAll("[data-copy]").forEach(function (b) {
      b.onclick = function () {
        var done = function () {
          var t = b.textContent;
          b.textContent = "✓";
          setTimeout(function () { b.textContent = t; }, 1200);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(b.dataset.copy).then(done).catch(done);
        } else done();
      };
    });
    box.querySelectorAll("[data-nav]").forEach(function (el) {
      el.onclick = function () {
        var id = el.dataset.id, t = el.dataset.nav;
        if (t === "com") navTo(id);
        else if (t === "for") navTo(sel.com, id);
        else if (t === "uni") navTo(sel.com, sel.for, id);
        else if (t === "set") navTo(sel.com, sel.for, sel.uni, id);
      };
    });
    box.querySelectorAll("[data-back]").forEach(function (el) {
      el.onclick = function () {
        var t = el.dataset.back;
        if (t === "home") navTo("");
        else if (t === "com") navTo(sel.com);
        else if (t === "for") navTo(sel.com, sel.for);
        else if (t === "uni") navTo(sel.com, sel.for, sel.uni);
      };
    });
  }

  function iniciarNavegacaoForum(forcar) {
    ensureSelRow();
    ensureBottomNav();
    if (!coms.length) {
      var box = $("fc-content");
      if (box) box.innerHTML = '<div class="fc-empty">Carregando contatos...</div>';
      api("obterHierarquiaPublicaForum", "").then(function (dados) {
        indexar(dados);
        loadComs();
        sync();
        if (typeof window.initMapa === "function") {
          window.initMapa("fc-map", null, coms, function (nome) {
            var ach = coms.filter(function (c) {
              return window.norm(c.nome) === window.norm(nome);
            })[0];
            if (ach) navTo(ach.id);
          });
        }
        if (typeof destacarComarcaMapa === "function") destacarComarcaMapa("");
      }).catch(function (e) {
        var box2 = $("fc-content");
        if (box2) box2.innerHTML = '<div class="fc-empty">Não foi possível carregar os contatos. ' + esc((e && e.message) || e) + "</div>";
      });
    } else {
      sync();
    }
  }

  /* exports usados pelo shell */
  window.iniciarNavegacaoForum = iniciarNavegacaoForum;
  window.recarregarNavegacaoForum = function () { iniciarNavegacaoForum(true); };
  window.renderizarMapaConsulta = function () {
    if (typeof destacarComarcaMapa === "function") destacarComarcaMapa("");
  };
  window.tentarInicializarMapa = window.renderizarMapaConsulta;
  window.fcInicio = function () { navTo(""); };
  window.fcMunicipio = function (id) { navTo(id); };
  window.fcForum = function (id) { navTo(sel.com, id); };
  window.fcNo = function (id) { navTo(sel.com, sel.for, id); };
  window.fcImprimirTudo = imprimirEscopo;
  window.fcImprimirForum = imprimirEscopo;
  window.fcImprimirUnidade = imprimirEscopo;

  document.addEventListener("DOMContentLoaded", function () {
    setTimeout(function () { iniciarNavegacaoForum(true); }, 120);
  });
})();
</script>
