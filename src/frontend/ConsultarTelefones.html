<!--
==========================================================
DIRETÓRIO DE CONTATOS — DEMO
Arquivo: ConsultarTelefones.html
==========================================================
-->

<div class="telefones-container">

  <div class="consulta-layout">

    <!-- =====================================================
         COLUNA ESQUERDA — MAPA RESPONSIVO
         ===================================================== -->

    <section id="consulta-mapa" aria-label="Mapa das comarcas">
      <div id="map" role="region" aria-label="Mapa interativo das comarcas"></div>
      <p class="hint" id="map-msg"></p>
    </section>

    <!-- =====================================================
         COLUNA DIREITA — PAINEL DE CONTATOS
         ===================================================== -->

    <div class="fc-panel">
      <div class="fc-head" id="panel-head">
        <div>
          <h2 class="fc-title">Contatos do PJES</h2>
          <p class="fc-subtitle">Consulte a estrutura completa por Comarca<span class="seta">→</span>Fórum<span class="seta">→</span>Unidade<span class="seta">→</span>Setor<span class="seta">→</span>Contatos. Selecione uma comarca no mapa ao lado, no menu suspenso ou na lista abaixo.</p>
        </div>
      </div>
      <span class="fc-pill fc-total-localidades" id="loc-count"></span>
      <p class="fc-subtitle" id="crumb"></p>
      <div class="fc-selects-row" id="sel-row">
        <select id="sel-com" class="fc-select" aria-label="Comarca"><option value="">Selecione uma comarca</option></select>
        <select id="sel-for" class="fc-select hidden" aria-label="Fórum" disabled><option value="">Fórum…</option></select>
        <select id="sel-uni" class="fc-select hidden" aria-label="Unidade" disabled><option value="">Unidade…</option></select>
        <select id="sel-set" class="fc-select hidden" aria-label="Setor" disabled><option value="">Setor…</option></select>
      </div>
      <div id="lista"><div class="fc-empty">Carregando contatos...</div></div>
      <div id="print-area"></div>
      <div class="fc-bottom-nav">
        <div class="nav-group">
          <button type="button" class="fc-btn hidden" id="btn-voltar">← Voltar</button>
          <button type="button" class="fc-btn" id="btn-topo">↑ Voltar ao topo</button>
        </div>
        <button type="button" class="fc-btn hidden" id="btn-print" title="Imprimir / Salvar PDF dos contatos do nível selecionado">🖨️ Imprimir / Salvar PDF</button>
      </div>
    </div>

  </div>

  <footer class="fc-footer">Google Apps Script + HTML/CSS/JS · Leaflet + GeoJSON público · dados mascarados</footer>

</div>
