<script>
function carregarSolicitacoes(){
  var filtro=document.getElementById("filtro-solicitacoes");
  if(filtro&&!filtro.dataset.ligado){filtro.dataset.ligado="1";filtro.oninput=aplicarFiltroSolicitacoes;}
  var selTodas=document.getElementById("sel-todas-solicitacoes");
  if(selTodas&&!selTodas.dataset.ligada){selTodas.dataset.ligada="1";selTodas.onchange=function(){
    var marcar=selTodas.checked;
    document.querySelectorAll("#corpo-tabela-solicitacoes input[type=checkbox]").forEach(function(chk){chk.checked=marcar;});
    atualizarBotaoLote();
  };}
  API.listarSolicitacoes(function(resp){
    if(!resp||resp.sucesso!==true){mostrarToast((resp&&resp.erro)||"Erro ao carregar solicitações.","error");return;}
    renderizarSolicitacoes(resp.dados||[]);
  },function(erro){mostrarToast((erro&&erro.message)||"Falha de comunicação.","error");});
}
var solicitacaoEmDetalhe=null;
var escoposAprovacaoEdicao=[];
var catalogoAprovacao=[];
function celulaSolicitacao(valor){var td=document.createElement("td");td.textContent=valor===null||valor===undefined||String(valor).trim()===""?"-":String(valor);return td;}
var listaSolicitacoesAtual=[];
function normalizarBusca(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function renderizarSolicitacoes(lista){
  listaSolicitacoesAtual = Array.isArray(lista) ? lista.slice() : [];
  aplicarFiltroSolicitacoes();
}
function aplicarFiltroSolicitacoes(){
  var termo = normalizarBusca(document.getElementById("filtro-solicitacoes") ? document.getElementById("filtro-solicitacoes").value : "");
  var lista = listaSolicitacoesAtual.filter(function(sol){
    if(!termo) return true;
    return normalizarBusca(sol.nome).indexOf(termo) >= 0 || normalizarBusca(sol.email).indexOf(termo) >= 0;
  });
  var tbody=document.getElementById("corpo-tabela-solicitacoes");if(!tbody)return;tbody.textContent="";
  if(!lista.length){var tr0=document.createElement("tr"),td0=document.createElement("td");td0.colSpan=5;td0.textContent=termo?"Nenhuma solicitação para este filtro.":"Nenhuma solicitação pendente.";td0.style.textAlign="center";tr0.appendChild(td0);tbody.appendChild(tr0);}
  lista.forEach(function(sol){
    var tr=document.createElement("tr");tr.tabIndex=0;tr.style.cursor="pointer";tr.title="Clique para ver e decidir esta solicitação";
    var tdSel=document.createElement("td");var chk=document.createElement("input");chk.type="checkbox";chk.style.width="auto";chk.setAttribute("aria-label","Selecionar "+(sol.nome||"solicitação"));chk.dataset.id=sol.id;
    chk.onclick=function(evento){evento.stopPropagation();atualizarBotaoLote();};
    tdSel.appendChild(chk);tr.appendChild(tdSel);
    tr.appendChild(celulaSolicitacao(sol.nome));tr.appendChild(celulaSolicitacao(sol.email));tr.appendChild(celulaSolicitacao(sol.nivelTexto));tr.appendChild(celulaSolicitacao(sol.status));
    tr.onclick=function(){abrirModalSolicitacao(sol);};tr.onkeydown=function(evento){if(evento.key==="Enter"||evento.key===" "){evento.preventDefault();abrirModalSolicitacao(sol);}};tbody.appendChild(tr);
  });
  var selTodas=document.getElementById("sel-todas-solicitacoes");if(selTodas)selTodas.checked=false;
  atualizarBotaoLote();
}
function idsSolicitacoesSelecionadas(){
  var ids=[];document.querySelectorAll("#corpo-tabela-solicitacoes input[type=checkbox]:checked").forEach(function(chk){ids.push(chk.dataset.id);});return ids;
}
function atualizarBotaoLote(){
  var btn=document.getElementById("btn-aprovar-lote");if(!btn)return;
  var n=idsSolicitacoesSelecionadas().length;
  btn.disabled=!n;btn.textContent=n?("Aprovar selecionados ("+n+")"):"Aprovar selecionados";
}
function aprovarLoteSolicitacoes(){
  var ids=idsSolicitacoesSelecionadas();if(!ids.length)return;
  confirmarAcaoSistema({titulo:"Aprovar em lote",mensagem:"Aprovar "+ids.length+" solicitação(ões) com os escopos pedidos?",textoConfirmar:"Aprovar tudo",perigo:false,icone:"✓"}).then(function(confirmado){
    if(!confirmado)return;
    var ok=0,falhas=0;
    (function proxima(i){
      if(i>=ids.length){mostrarToast("Lote concluído: "+ok+" aprovada(s)"+(falhas?(", "+falhas+" falha(s)"):"")+".",falhas?"error":"success");carregarSolicitacoes();return;}
      var sol=null;listaSolicitacoesAtual.forEach(function(s){if(String(s.id)===String(ids[i]))sol=s;});
      API.aprovarSolicitacao(ids[i],(sol&&sol.escopos)||[],function(){ok++;proxima(i+1);},function(){falhas++;proxima(i+1);});
    })(0);
  });
}
function chaveEscopoAprovacao(escopo){return escopo.tipo+":"+escopo.id;}
function rotuloEscopoAprovacao(escopo){
  var item=catalogoAprovacao.filter(function(i){return i.tipo===escopo.tipo&&i.id===escopo.id;})[0];
  var base=item?(item.caminhoTexto||item.nome||item.id):(escopo.id||"");
  if(item&&typeof item.n_contatos==="number")base+=" ("+item.n_contatos+")";
  return escopo.tipo+": "+base;
}
function abrirModalSolicitacao(sol){
  solicitacaoEmDetalhe=sol;
  escoposAprovacaoEdicao=(sol.escopos||[]).map(function(e){return {tipo:e.tipo,id:e.id};});
  var alvo=document.getElementById("detalhes-solicitacao");alvo.textContent="";
  [["Nome",sol.nome],["E-mail",sol.email],["Nível de acesso",sol.nivelTexto],["Motivo",sol.justificativa||"Não informado"],["Status",sol.status]].forEach(function(item){var bloco=document.createElement("div");bloco.style.marginBottom="14px";var titulo=document.createElement("strong");titulo.textContent=item[0];var valor=document.createElement("div");valor.textContent=item[1];valor.style.marginTop="4px";valor.style.whiteSpace="pre-wrap";bloco.appendChild(titulo);bloco.appendChild(valor);alvo.appendChild(bloco);});
  var blocoEsc=document.createElement("div");blocoEsc.style.marginBottom="14px";
  var tituloEsc=document.createElement("strong");tituloEsc.textContent="Escopos (ajuste antes de aprovar, se preciso)";blocoEsc.appendChild(tituloEsc);
  var listaEsc=document.createElement("div");listaEsc.id="escopos-aprovacao-lista";listaEsc.style.marginTop="6px";blocoEsc.appendChild(listaEsc);
  var linhaAdd=document.createElement("div");linhaAdd.style.marginTop="8px";
  var selectAdd=document.createElement("select");selectAdd.id="escopo-aprovacao-select";selectAdd.style.maxWidth="100%";
  var btnAdd=document.createElement("button");btnAdd.type="button";btnAdd.className="btn";btnAdd.style.marginLeft="8px";btnAdd.textContent="Adicionar";btnAdd.onclick=adicionarEscopoAprovacao;
  linhaAdd.appendChild(selectAdd);linhaAdd.appendChild(btnAdd);blocoEsc.appendChild(linhaAdd);
  alvo.appendChild(blocoEsc);
  API.listarEscoposParaAcesso(function(resp){
    catalogoAprovacao=(resp&&resp.sucesso===true&&Array.isArray(resp.dados))?resp.dados:[];
    renderizarEscoposAprovacao();
  },function(){catalogoAprovacao=[];renderizarEscoposAprovacao();});
  document.getElementById("modal-solicitacao").classList.remove("hidden");
}
function renderizarEscoposAprovacao(){
  var lista=document.getElementById("escopos-aprovacao-lista");if(!lista)return;lista.textContent="";
  if(!escoposAprovacaoEdicao.length){lista.textContent="Nenhum escopo.";}
  escoposAprovacaoEdicao.forEach(function(escopo){
    var chip=document.createElement("span");chip.className="config-comarca-chip";chip.style.margin="0 6px 6px 0";
    chip.textContent=rotuloEscopoAprovacao(escopo)+" ";
    var x=document.createElement("button");x.type="button";x.textContent="✕";x.title="Remover";x.style.marginLeft="6px";
    x.onclick=function(){escoposAprovacaoEdicao=escoposAprovacaoEdicao.filter(function(e){return chaveEscopoAprovacao(e)!==chaveEscopoAprovacao(escopo);});renderizarEscoposAprovacao();};
    chip.appendChild(x);lista.appendChild(chip);
  });
  var select=document.getElementById("escopo-aprovacao-select");if(!select)return;select.textContent="";
  var vazio=document.createElement("option");vazio.value="";vazio.textContent="Selecionar escopo para adicionar…";select.appendChild(vazio);
  catalogoAprovacao.forEach(function(item){
    if(escoposAprovacaoEdicao.some(function(e){return e.tipo===item.tipo&&e.id===item.id;}))return;
    var op=document.createElement("option");op.value=chaveEscopoAprovacao(item);op.textContent=rotuloEscopoAprovacao(item);select.appendChild(op);
  });
}
function adicionarEscopoAprovacao(){
  var select=document.getElementById("escopo-aprovacao-select");if(!select||!select.value)return;
  var partes=select.value.split(":");var tipo=partes[0];var id=partes.slice(1).join(":");
  escoposAprovacaoEdicao.push({tipo:tipo,id:id});renderizarEscoposAprovacao();
}
function fecharModalSolicitacao(){document.getElementById("modal-solicitacao").classList.add("hidden");solicitacaoEmDetalhe=null;escoposAprovacaoEdicao=[];}
function decidirSolicitacao(status){
  if(!solicitacaoEmDetalhe)return;var aprovando=status==="APROVADO";
  var motivoRejeicao="";
  if(!aprovando){
    motivoRejeicao=String(document.getElementById("motivo-rejeicao")?document.getElementById("motivo-rejeicao").value:"").trim();
    if(!motivoRejeicao){mostrarToast("Informe o motivo da rejeição — ele aparece para o solicitante.","warning");return;}
  }
  confirmarAcaoSistema({titulo:aprovando?"Aprovar solicitação":"Rejeitar solicitação",mensagem:(aprovando?"Aprovar":"Rejeitar")+" esta solicitação de acesso?"+(aprovando&&escoposAprovacaoEdicao.length?" ("+escoposAprovacaoEdicao.length+" escopo(s))":"")+(!aprovando?" Motivo: "+motivoRejeicao:""),textoConfirmar:aprovando?"Aprovar":"Rejeitar",perigo:!aprovando,icone:aprovando?"✓":"!"}).then(function(confirmado){
    if(!confirmado||!solicitacaoEmDetalhe)return;
    var feito=function(resp){if(resp&&resp.sucesso===true){fecharModalSolicitacao();var m=document.getElementById("motivo-rejeicao");if(m)m.value="";mostrarToast(aprovando?"Solicitação aprovada.":"Solicitação rejeitada.",aprovando?"success":"info");carregarSolicitacoes();}else mostrarToast((resp&&resp.erro)||"Falha ao processar solicitação.","error");};
    var falha=function(erro){mostrarToast((erro&&erro.message)||"Falha de comunicação.","error");};
    if(aprovando)API.aprovarSolicitacao(solicitacaoEmDetalhe.id,escoposAprovacaoEdicao,feito,falha);
    else API.rejeitarSolicitacao(solicitacaoEmDetalhe.id,motivoRejeicao,feito,falha);
  });
}
function aprovarSolicitacaoAtual(){decidirSolicitacao("APROVADO");}
function rejeitarSolicitacaoAtual(){decidirSolicitacao("REJEITADO");}
</script>
